# Reference metadata for submitting KabelWacht to F-Droid.
#
# This file is a template for the maintainer to copy into the fdroiddata repository
# (https://gitlab.com/fdroid/fdroiddata) under metadata/. It is NOT read from this
# repo by F-Droid — inclusion happens via a merge request to fdroiddata.
#
# Adjust the URLs to the real repository location before submitting.

Categories:
  - Internet
  - Security
License: AGPL-3.0-or-later
AuthorName: Tobias Mueller
SourceCode: https://github.com/muelli/kabelwacht
IssueTracker: https://github.com/muelli/kabelwacht/issues
Changelog: https://github.com/muelli/kabelwacht/releases

RepoType: git
Repo: https://github.com/muelli/kabelwacht.git

# Binaries lets F-Droid compare its own reproducible build against the developer's
# signed APK and, on a match, mark the build "Reproducible" / publish it verbatim.
Binaries: https://muelli.github.io/KabelWacht/fdroid/repo/kabelwacht-%c.apk

Builds:
  - versionName: '1'
    versionCode: 1
    commit: v1
    subdir: app
    gradle:
      - yes

  # From v2, WireGuard is built from source, so the build needs the submodules,
  # the NDK, and network access for the pinned Go toolchain and Go modules.
  - versionName: '2'
    versionCode: 2
    commit: v2
    subdir: app
    submodules: true
    ndk: 27.2.12479018
    gradle:
      - yes

AutoUpdateMode: Version v%c
UpdateCheckMode: Tags
CurrentVersion: '2'
CurrentVersionCode: 2
