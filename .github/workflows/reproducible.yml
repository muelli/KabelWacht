name: Reproducible build

# Builds the release APK twice, from two independent checkouts in different paths,
# and fails if the results are not byte-for-byte identical. This is the property
# F-Droid relies on to verify that a published binary matches its source.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (copy A)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          path: a

      - name: Checkout (copy B)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          path: b

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          dependency-graph: disabled  # avoids classpath artifacts absent from verification-metadata

      - name: Build A
        run: ./a/gradlew -p a clean :app:assembleRelease --stacktrace

      - name: Build B
        run: ./b/gradlew -p b clean :app:assembleRelease --stacktrace

      - name: Compare (must be byte-identical)
        run: |
          A=a/app/build/outputs/apk/release/app-release-unsigned.apk
          B=b/app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum "$A" "$B"
          if cmp -s "$A" "$B"; then
            echo "✅ Reproducible: the two builds are byte-for-byte identical."
          else
            echo "::error::Build is not reproducible — the two APKs differ."
            cmp "$A" "$B" || true
            exit 1
          fi
