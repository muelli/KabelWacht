name: Publish F-Droid repo

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Push the generated repo to the fdroid-repo branch and (best-effort) enable Pages.
permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Surfaced at job level so steps can gate on their presence.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}          # app (APK) signing key
      FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}  # repo index key
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive  # WireGuard sources are built from source

      - name: Check required secrets
        id: gate
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$FDROID_KEYSTORE_BASE64" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping F-Droid publish: set the app signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) and the repo secrets (FDROID_KEYSTORE_BASE64, FDROID_KEYSTORE_PASS, FDROID_KEY_PASS, FDROID_KEY_ALIAS). See scripts/fdroid-init.sh."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read version
        if: steps.gate.outputs.ready == 'true'
        id: version
        run: echo "code=$(grep -E '^versionCode=' version.properties | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.gate.outputs.ready == 'true'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install NDK and CMake
        if: steps.gate.outputs.ready == 'true'
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        if: steps.gate.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          dependency-graph: disabled  # avoids classpath artifacts absent from verification-metadata

      - name: Build and sign release APK
        if: steps.gate.outputs.ready == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --stacktrace
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/app.jks"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          CODE="${{ steps.version.outputs.code }}"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/kabelwacht-$CODE-aligned.apk"
          SIGNED="$RUNNER_TEMP/kabelwacht-$CODE.apk"
          "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/app.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" "$ALIGNED"
          echo "SIGNED_APK=$SIGNED" >> "$GITHUB_ENV"
          # Ensure fdroid's tools (aapt/apksigner) are on PATH.
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"

      - name: Install fdroidserver
        if: steps.gate.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner libmagic1 qrencode
          pip install fdroidserver

      - name: Generate and publish repo
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASS }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          CODE="${{ steps.version.outputs.code }}"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Restore the persistent repo state (or start an orphan branch on first run).
          if git ls-remote --exit-code --heads "$REMOTE" fdroid-repo >/dev/null 2>&1; then
            git clone --depth 1 --branch fdroid-repo --single-branch "$REMOTE" site
          else
            git clone --depth 1 "$REMOTE" site
            ( cd site && git checkout --orphan fdroid-repo && git rm -rf . >/dev/null 2>&1 || true )
          fi
          # Remove any previous root-level repo layout (migrated to /fdroid/repo).
          rm -rf site/repo site/metadata site/archive

          # Serve the repo under /fdroid/repo so plain https links auto-open F-Droid.
          mkdir -p site/fdroid/repo site/fdroid/metadata

          # Runtime-only config with the index signing key (never committed).
          cp fdroid/config.yml site/fdroid/config.yml
          echo "$FDROID_KEYSTORE_BASE64" | base64 -d > site/fdroid/fdroid.p12
          cat >> site/fdroid/config.yml <<EOF
          sdk_path: "${ANDROID_HOME}"
          keystore: "$(pwd)/site/fdroid/fdroid.p12"
          repo_keyalias: "${FDROID_KEY_ALIAS}"
          keystorepass: "${FDROID_KEYSTORE_PASS}"
          keypass: "${FDROID_KEY_PASS}"
          EOF

          cp "$SIGNED_APK" "site/fdroid/repo/kabelwacht-$CODE.apk"

          ( cd site/fdroid && fdroid update --create-metadata --verbose )

          # --- Software-freedom proof: F-Droid's own scanner (fails publish on any finding) ---
          FDROID_VER="$(fdroid --version 2>&1 | head -1)"
          fdroid scanner --exit-code "$SIGNED_APK" 2>&1 | tee scan.out
          {
            echo "KabelWacht — software-freedom report (versionCode $CODE)"
            echo "Generated $(date -u '+%Y-%m-%d %H:%M:%SZ') by GitHub Actions."
            echo
            echo "== F-Droid scanner (fdroidserver $FDROID_VER) =="
            echo "Command: fdroid scanner --exit-code kabelwacht-$CODE.apk"
            echo "Result: PASS — no known non-free classes, trackers, or extra signing blocks."
            echo
            sed 's/^/    /' scan.out
            echo
            echo "== Bundled native libraries and their free-software origin =="
            echo "  libwg.so, libwg-go.so, libwg-quick.so  <- com.wireguard.android:tunnel (GPL-2.0, wireguard-go)"
            echo "  libandroidx.graphics.path.so           <- androidx.graphics:graphics-path (Apache-2.0)"
            echo "  libdatastore_shared_counter.so         <- androidx.datastore (Apache-2.0)"
            echo
            unzip -l "$SIGNED_APK" | awk '/\.so$/{print "    "$4"  ("$1" bytes)"}'
            echo
            echo "App license: GPL-2.0-or-later. All dependencies are free software (see README)."
          } > site/freedom-report.txt

          # Compute the repo fingerprint for the landing page / add-repo link.
          FP="$(keytool -list -v -keystore site/fdroid/fdroid.p12 -storepass "$FDROID_KEYSTORE_PASS" -alias "$FDROID_KEY_ALIAS" \
                | awk -F': ' '/SHA256:/{gsub(/:/,"",$2); print tolower($2); exit}')"
          REPO_URL="https://${GITHUB_REPOSITORY%/*}.github.io/${GITHUB_REPOSITORY#*/}/fdroid/repo"
          ADD_URL="${REPO_URL}?fingerprint=${FP}"
          touch site/.nojekyll

          # QR code that F-Droid's "Add repository" scanner understands.
          qrencode -o site/qr.png -s 8 -m 2 "$ADD_URL"

          # Direct APK download links (newest first), for people without F-Droid.
          APK_LIST=""
          for apk in $(ls -1 site/fdroid/repo/*.apk 2>/dev/null | sort -Vr); do
            name="$(basename "$apk")"
            size="$(du -h "$apk" | cut -f1)"
            label=""; [ "$name" = "kabelwacht-$CODE.apk" ] && label=" — latest"
            APK_LIST="${APK_LIST}<li><a href=\"fdroid/repo/${name}\">${name}</a> (${size})${label}</li>"
          done

          cat > site/index.html <<EOF
          <!doctype html><meta charset="utf-8">
          <title>KabelWacht F-Droid repo</title>
          <style>
            body{font-family:system-ui,sans-serif;max-width:40rem;margin:2rem auto;padding:0 1rem;line-height:1.5}
            code{word-break:break-all;background:#eee;padding:.1em .3em;border-radius:.2em}
            img{image-rendering:pixelated;width:280px;height:280px;border:1px solid #ccc}
            @media(prefers-color-scheme:dark){body{background:#111;color:#eee}code{background:#333}}
          </style>
          <h1>KabelWacht F-Droid repository</h1>
          <p>In the F-Droid app: <b>Settings → Repositories → +</b>, then scan this QR code:</p>
          <p><img src="qr.png" alt="F-Droid repository QR code"></p>
          <p>Or add it by hand:</p>
          <p>URL: <code>${REPO_URL}</code><br>
             Fingerprint: <code>${FP}</code></p>
          <p><a href="fdroidrepos:${ADD_URL}">On your phone, tap here to add it directly.</a></p>
          <h2>Direct download (without F-Droid)</h2>
          <p>F-Droid is recommended so you get automatic updates. Otherwise download an
             APK and install it (you may need to allow installing from unknown sources):</p>
          <ul>${APK_LIST}</ul>
          <h2>Software freedom</h2>
          <p>This build passed <b>fdroid scanner</b> — F-Droid's own scanner for known
             non-free libraries, trackers, and tampered signing blocks — with no
             findings. <a href="freedom-report.txt">Read the full freedom report.</a></p>
          EOF

          # Commit only the public, signed artifacts — never the config/keystore.
          cat > site/.gitignore <<'EOF'
          config.yml
          *.p12
          *.jks
          tmp/
          EOF

          cd site
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Publish KabelWacht versionCode $CODE" || { echo "nothing to commit"; exit 0; }
          git push "$REMOTE" HEAD:fdroid-repo

      - name: Enable GitHub Pages (best-effort, first run only)
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"source":{"branch":"fdroid-repo","path":"/"}}' \
            && echo "Pages enabled." || echo "Pages already enabled or must be enabled manually."
