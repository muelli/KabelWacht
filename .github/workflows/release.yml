name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write      # needed to create a GitHub Release
  id-token: write      # Sigstore keyless signing (binary transparency)
  attestations: write  # store the provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Surfaced at job level so it can be used in the signing step's `if:` check.
      # The seed deterministically drives the whole signing identity (key,
      # keystore, alias, passphrase) via scripts/derive-signing-key.py.
      APP_SIGNING_SEED: ${{ secrets.APP_SIGNING_SEED }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive  # WireGuard sources are built from source

      - name: Read version and locate changelog
        id: version
        run: |
          CODE="$(grep -E '^versionCode=' version.properties | cut -d= -f2 | tr -d '[:space:]')"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          if [ -f "$CHANGELOG" ]; then
            echo "changelog=${CHANGELOG}" >> "$GITHUB_OUTPUT"
            echo "Using fastlane changelog: ${CHANGELOG}"
          else
            echo "changelog=" >> "$GITHUB_OUTPUT"
            echo "::warning::No fastlane changelog at ${CHANGELOG}; release notes will be auto-generated."
          fi

      - name: Verify tag matches committed version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          EXPECTED="v${{ steps.version.outputs.code }}"
          ACTUAL="${GITHUB_REF_NAME}"
          echo "expected tag ${EXPECTED}; pushed tag ${ACTUAL}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Tag ${ACTUAL} does not match version.properties (${EXPECTED}). Bump version.properties, add fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.code }}.txt, commit, then tag ${EXPECTED}."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          dependency-graph: disabled  # avoids classpath artifacts absent from verification-metadata
          cache-read-only: true  # tag runs reuse main's cache without churning it

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      # Optional signing: only runs when the signing seed is configured.
      # F-Droid rebuilds and signs from source, so an unsigned APK is still a valid
      # release artifact for that channel.
      - name: Sign APK
        id: sign
        if: ${{ env.APP_SIGNING_SEED != '' }}
        run: |
          set -euo pipefail
          pip install --quiet cryptography
          APP_PASS="$(SEED="$APP_SIGNING_SEED" scripts/derive-signing-key.py app "$RUNNER_TEMP/app.p12")"
          echo "::add-mask::$APP_PASS"
          export APP_PASS
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          DIR="app/build/outputs/apk/release"
          UNSIGNED="$DIR/app-release-unsigned.apk"
          ALIGNED="$DIR/kabelwacht-${{ steps.version.outputs.code }}-aligned.apk"
          SIGNED="$DIR/kabelwacht-${{ steps.version.outputs.code }}.apk"
          "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/app.p12" \
            --ks-pass env:APP_PASS \
            --ks-key-alias app \
            --out "$SIGNED" "$ALIGNED"
          # Keep only the signed APK as the release artifact.
          rm -f "$UNSIGNED" "$ALIGNED"

      - name: Generate checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS
          cat SHA256SUMS

      # Binary transparency: record each artifact's digest, bound to this exact
      # workflow run, in the public Sigstore transparency log (Rekor). Verify with:
      #   gh attestation verify <file> --repo ${{ github.repository }}
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: ${{ steps.version.outputs.changelog }}
          generate_release_notes: ${{ steps.version.outputs.changelog == '' }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS
