name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive  # WireGuard sources are built from source

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          # Don't inject the dependency-graph plugin — it adds artifacts to the
          # build classpath that aren't in gradle/verification-metadata.xml.
          dependency-graph: disabled
          # Only main writes the cache; PRs/branches read it. Cuts cache churn.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Lint, test and assemble debug APK
        # Native WireGuard is compiled for one ABI only here: CI validates that the
        # from-source build works without paying for all four ABIs on every push.
        # Tag-driven workflows (release / publish-fdroid / reproducible) build all
        # ABIs. The uploaded debug APK is arm64-only as a result.
        run: ./gradlew lint testDebugUnitTest assembleDebug -PtunnelAbis=arm64-v8a --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kabelwacht-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            app/build/reports/**
          if-no-files-found: ignore
